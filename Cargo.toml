[package]
name = "assetc"
version = "0.1.0"
edition = "2024"
description = "Compiles source assets into runtime-friendly binary formats for video games"

[dependencies]
bevy_egui = "0.43.1"
clap = { version = "4.6.7", features = ["derive"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
globset = "0.4.21"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[dependencies.bevy]
version = "0.20.1"
default-features = false
# Bevy defaults (2d, 3d, ui, audio) with default_platform expanded minus bevy_gilrs (gamepad).
features = [
    "default_app",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "scene",
    "picking",
    "audio",
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "custom_cursor",
    "sysinfo_plugin",
    "keyboard",
    "mouse",
    "touch",
]

[dev-dependencies]
ktx2 = "0.5.0"
tempfile = "3.27.0"
